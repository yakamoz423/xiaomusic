---
name: Build XiaoMusic HAOS addon

on:
  push:
    branches: [main]
    paths:
      - "xiaomusic/**"
      - "plugins/**"
      - "holiday/**"
      - "xiaomusic.py"
      - "pyproject.toml"
      - "ha_xiaomusic/**"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: meta
        run: |
          version="$(awk '/^version:/ { gsub(/"/,"",$2); print $2; exit }' ha_xiaomusic/config.yaml)"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.arch }}-xiaomusic" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ha_xiaomusic/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base:9.1.0
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_NAME=XiaoMusic
            BUILD_DESCRIPTION=XiaoMusic HAOS addon (conversation + yt-dlp + play_media)
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: |
            type=gha,scope=xiaomusic-${{ matrix.arch }}
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=xiaomusic-${{ matrix.arch }}
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
