---
configuration:
  conversation_entity:
    name: Conversation entity
    description: >-
      Required. MIOT conversation sensor entity id, e.g.
      sensor.xiaomi_l05c_xxxx_conversation.
  media_player:
    name: Target media player
    description: >-
      Optional. Leave empty to auto-pick (prefers XiaoAI / Xiaomi speakers).
      Or set a media_player.* entity id.
  command_prefixes:
    name: Command prefixes
    description: >-
      Comma-separated voice prefixes that trigger music commands
      (aligned with built-in play keywords).
  poll_interval_seconds:
    name: Poll interval (seconds)
    description: >-
      How often to call homeassistant.update_entity and check for new queries.
  music_public_base:
    name: Public music base URL
    description: >-
      Optional. Base URL the speaker can reach, e.g. http://192.168.1.10:8090.
      Empty = auto-detect LAN IP + add-on port.
  disable_download:
    name: Disable download
    description: When true, only play already-downloaded / local music.
  search_prefix:
    name: yt-dlp search prefix
    description: e.g. bilisearch: or ytsearch:
  verbose:
    name: Verbose logging
    description: Enable debug logs.
  enable_yt_dlp_cookies:
    name: Enable yt-dlp cookies
    description: >-
      Pass /data/xiaomusic_conf/yt-dlp-cookie.txt to yt-dlp downloads.
      Needed to bypass Bilibili HTTP 412. Upload a Netscape cookies.txt
      on the Ingress settings page.
